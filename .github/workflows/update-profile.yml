name: Refresh terminal profile

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update_profile.py
      - test_profile.py
      - .github/workflows/update-profile.yml

concurrency:
  group: terminal-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test calendar parser and SVG output
        run: python3 -m unittest -q test_profile.py
      - name: Generate graphics from public GitHub activity
        run: python3 update_profile.py
      - name: Commit updated graphics
        run: |
          git add terminal.svg contributions.svg contributions.json
          if git diff --cached --quiet; then
            echo 'Profile art is up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh terminal profile [skip ci]'
          git push
